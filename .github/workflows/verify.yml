name: Verify official plugin packages
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run artifacts:build
      - name: Check committed artifacts
        run: |
          if test -n "$(git status --porcelain -- artifacts)"; then
            echo 'Generated artifacts differ from the reviewed, committed files.'
            exit 1
          fi